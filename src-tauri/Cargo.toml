[package]
name = "coda"
version = "1.7.4"
description = "coda — the debate round, in one window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# updating itself (lib/update.ts): the newest release's latest.json, signed with coda's updater key
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "io-util", "macros", "fs"] }
# the caselist kept here (src/caselist.rs): the weekly archive, downloaded — the same client the updater and iroh use
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
# partners, app to app (src/p2p.rs)
iroh = "1.5"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
