# Hourly results updater. Vercel Hobby only allows daily crons, so the hourly
# schedule lives here instead of in vercel.json.
# Add two repository secrets: SITE_URL (e.g. https://the-break.vercel.app) and
# UPDATE_SECRET (the same value as the app's UPDATE_SECRET env var).
name: Update results
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the updater
        run: |
          curl -fsS -X POST "$SITE_URL/api/update" \
            -H "x-update-secret: $UPDATE_SECRET" \
            --max-time 120
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
